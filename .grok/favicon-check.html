<!doctype html>
<meta charset="utf-8">
<title>favicon check</title>
<style>
  html,body{margin:0;background:#7a7a7a}
  .row{display:flex;align-items:center;gap:12px;padding:12px}
  .cell{background:#fff;line-height:0}
  .cell.dark{background:#090b10}
</style>
<body>
  <div class="row">
    <div class="cell"><img src="../public/favicon.svg" width="16" height="16"></div>
    <div class="cell dark"><img src="../public/favicon.svg" width="16" height="16"></div>
    <div class="cell"><img src="../public/favicon.svg" width="32" height="32"></div>
    <div class="cell dark"><img src="../public/favicon.svg" width="32" height="32"></div>
    <div class="cell dark"><img src="../public/favicon.svg" width="64" height="64"></div>
  </div>
</body>
